<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Active Intervention Mini-Game</title>
  
  <!-- โหลด MediaPipe Pose & Camera Utils จาก CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; } /* ซ่อนวิดีโอหลัก */
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 20px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 280px;
    }
    .status { color: #FFD54F; font-weight: bold; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>เกมยืดกล้ามเนื้อแก้ Office Syndrome</p>

  <div class="score-board">
    <div>สถานะท่าทาง: <span id="pose-status" class="status">กำลังตรวจจับ...</span></div>
    <div>มุมเอียงคอ: <span id="angle-val">0</span>°</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const angleVal = document.getElementById('angle-val');

    // ฟังก์ชันคำนวณองศาระหว่างจุด 3 จุด
    function calculateAngle(a, b, c) {
      if (!a || !b || !c) return 180;
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    // ฟังก์ชันประมวลผลเมื่อ MediaPipe จับจุดข้อต่อได้
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาดภาพจากกล้องลงบน Canvas และทำ Mirror ให้เหมือนส่องกระจก
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // ดึงพิกัดตามดัชนีของ MediaPipe Pose
        const leftEar = results.poseLandmarks[7];        // หูซ้าย (Index 7)
        const rightEar = results.poseLandmarks[8];       // หูขวา (Index 8)
        const leftShoulder = results.poseLandmarks[11];  // ไหล่ซ้าย (Index 11)
        const rightShoulder = results.poseLandmarks[12]; // ไหล่ขวา (Index 12)

        // 1. วาดเส้นเชื่อมโครงสร้าง (คอซ้าย, คอขวา, และแนวฐานไหล่)
        drawLine(leftEar, leftShoulder, '#FF3D00');       // เส้นหูซ้าย -> ไหล่ซ้าย (สีส้ม)
        drawLine(rightEar, rightShoulder, '#FF9100');     // เส้นหูขวา -> ไหล่ขวา (สีส้มอ่อน)
        drawLine(leftShoulder, rightShoulder, '#00E676'); // เส้นแนวไหล่ซ้าย -> ไหล่ขวา (สีเขียว)

        // 2. วาดจุดข้อต่อ
        drawPoint(leftEar, '#FF3D00');       // หูซ้าย = สีส้ม
        drawPoint(rightEar, '#FF9100');      // หูขวา = สีส้มอ่อน
        drawPoint(leftShoulder, '#00E676');  // ไหล่ซ้าย = สีเขียว
        drawPoint(rightShoulder, '#29B6F6'); // ไหล่ขวา = สีฟ้า

        // คำนวณองศาการเอียงคอทั้งฝั่งซ้ายและขวา
        const leftAngle = calculateAngle(leftEar, leftShoulder, rightShoulder);
        const rightAngle = calculateAngle(rightEar, rightShoulder, leftShoulder);

        // ดึงมุมเอียงที่น้อยที่สุด (ฝั่งที่กำลังยืดคอลงมา)
        const minAngle = Math.min(leftAngle, rightAngle);
        angleVal.innerText = minAngle;

        // เช็กระยะทางแนวตั้งระหว่างหูกับไหล่
        const leftDistY = Math.abs(leftEar.y - leftShoulder.y);
        const rightDistY = Math.abs(rightEar.y - rightShoulder.y);

        // เงื่อนไข: ถ้าเอียงคอยืดฝั่งใดฝั่งหนึ่งลงมาเกินเกณฑ์
        if (minAngle < 65 || leftDistY < 0.18 || rightDistY < 0.18) {
          poseStatus.innerText = "ดีมาก! เอียงคอยืดกล้ามเนื้อค้างไว้";
          poseStatus.style.color = "#00E676";
        } else {
          poseStatus.innerText = "เอียงคอไปทางซ้ายหรือขวาเพื่อเริ่มยืด";
          poseStatus.style.color = "#FFD54F";
        }
      }
      canvasCtx.restore();
    }

    // ฟังก์ชันสำหรับวาดเส้นเชื่อมจุด
    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    // ฟังก์ชันวาดจุดข้อต่อ
    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;

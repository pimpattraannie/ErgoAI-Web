<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Guided Neck Stretch Routine</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 22px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 340px;
    }
    .status { color: #FFD54F; font-weight: bold; }
    .timer { font-size: 36px; color: #00E676; font-weight: bold; margin-top: 5px; }
    .angle-debug { font-size: 16px; color: #888; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>โปรแกรมนำยืดคอแก้ Office Syndrome (ซ้าย ➔ ขวา)</p>

  <div class="score-board">
    <div>สถานะ: <span id="pose-status" class="status">กำลังเตรียมพร้อม...</span></div>
    <div class="timer" id="timer-val">⏱️ 5</div>
    <div class="angle-debug">มุมคอซ้าย: <span id="left-angle">0</span>° | มุมคอขวา: <span id="right-angle">0</span>°</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const timerVal = document.getElementById('timer-val');
    const leftAngleVal = document.getElementById('left-angle');
    const rightAngleVal = document.getElementById('right-angle');

    let currentStep = 0;          // 0 = ยืดซ้าย, 1 = ยืดขวา, 2 = สำเร็จ
    let holdStartTime = null; 
    const HOLD_DURATION = 5;      // ค้างไว้ 5 วินาที
    const STRETCH_THRESHOLD = 58; // เกณฑ์องศาการยืดคอ (ปรับเป็น 58°)

    // คำนวณองศาระหว่างจุด 3 จุด
    function calculateAngle(a, b, c) {
      if (!a || !b || !c) return 180;
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาดภาพ Canvas แบบ Mirror
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // MediaPipe Pose Keypoints:
        // Index 7 = หูขวา (Right Ear), Index 8 = หูซ้าย (Left Ear)
        // Index 11 = ไหล่ขวา (Right Shoulder), Index 12 = ไหล่ซ้าย (Left Shoulder)
        const rawRightEar = results.poseLandmarks[7];       
        const rawLeftEar = results.poseLandmarks[8];        
        const rawRightShoulder = results.poseLandmarks[11]; 
        const rawLeftShoulder = results.poseLandmarks[12];  

        // แปลงพิกัด Mirror ให้ตรงกับร่างกายผู้ใช้บนหน้าจอ 100% (แก้ไขถูกต้องแล้ว)
        const userLeftEar = { x: 1 - rawLeftEar.x, y: rawLeftEar.y };
        const userRightEar = { x: 1 - rawRightEar.x, y: rawRightEar.y };
        const userLeftShoulder = { x: 1 - rawLeftShoulder.x, y: rawLeftShoulder.y };
        const userRightShoulder = { x: 1 - rawRightShoulder.x, y: rawRightShoulder.y };

        // 1. วาดเส้นโครงสร้างถูกต้อง (คอซ้าย->ไหล่ซ้าย, คอขวา->ไหล่ขวา, ฐานไหล่)
        drawLine(userLeftEar, userLeftShoulder, '#FF3D00');       // หูซ้ายไปไหล่ซ้าย (ส้ม)
        drawLine(userRightEar, userRightShoulder, '#FF9100');     // หูขวาไปไหล่ขวา (ส้มอ่อน)
        drawLine(userLeftShoulder, userRightShoulder, '#00E676'); // ไหล่ซ้ายไปไหล่ขวา (เขียว)

        // 2. วาดจุดข้อต่อ
        drawPoint(userLeftEar, '#FF3D00');       // จุดหูซ้าย
        drawPoint(userRightEar, '#FF9100');      // จุดหูขวา
        drawPoint(userLeftShoulder, '#00E676');  // จุดไหล่ซ้าย
        drawPoint(userRightShoulder, '#29B6F6'); // จุดไหล่ขวา

        // คำนวณองศาฐานไหล่เทียบกับคอ
        const userLeftAngle = calculateAngle(userLeftEar, userLeftShoulder, userRightShoulder);
        const userRightAngle = calculateAngle(userRightEar, userRightShoulder, userLeftShoulder);

        leftAngleVal.innerText = userLeftAngle;
        rightAngleVal.innerText = userRightAngle;

        const currentTime = Date.now();

        // 🎯 LOGIC การจัดการขั้นตอนยืด (STEP 0 -> STEP 1 -> STEP 2)
        if (currentStep === 0) {
          // STEP 0: ยืดคอไปทาง "ซ้าย" ของผู้ใช้ (มุมแคบลง < 58°)
          if (userLeftAngle < STRETCH_THRESHOLD) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอซ้าย...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดครบ 5 วินาที -> ไป STEP 1 (ขวา)
              currentStep = 1;
              holdStartTime = null;
              timerVal.innerText = `⏱️ 5`;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = "1. เอียงคอไปทาง 'ซ้าย' ของคุณ (หูซ้ายชิดไหล่ซ้าย)";
            poseStatus.style.color = "#FFD54F";
            timerVal.innerText = `⏱️ 5`;
          }
        } 
        else if (currentStep === 1) {
          // STEP 1: ยืดคอไปทาง "ขวา" ของผู้ใช้ (มุมแคบลง < 58°)
          if (userRightAngle < STRETCH_THRESHOLD) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอขวา...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดครบ 5 วินาที -> จบเกม (STEP 2)
              currentStep = 2;
              holdStartTime = null;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = "2. เอียงคอไปทาง 'ขวา' ของคุณ (หูขวาชิดไหล่ขวา)";
            poseStatus.style.color = "#FF9100";
            timerVal.innerText = `⏱️ 5`;
          }
        } 
        else if (currentStep === 2) {
          // STEP 2: จบเกม
          poseStatus.innerText = "🎉 ยอดเยี่ยม! คุณยืดคอครบทั้ง 2 ข้างเรียบร้อยแล้ว";
          poseStatus.style.color = "#00E676";
          timerVal.innerText = "✅ สำเร็จ";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

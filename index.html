<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Guided Neck Stretch Routine</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 22px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 340px;
    }
    .status { color: #FFD54F; font-weight: bold; }
    .timer { font-size: 36px; color: #00E676; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>โปรแกรมนำยืดคอแก้ Office Syndrome (ซ้าย ➔ ขวา)</p>

  <div class="score-board">
    <div>สถานะ: <span id="pose-status" class="status">กำลังเตรียมพร้อม...</span></div>
    <div class="timer" id="timer-val">⏱️ 5</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const timerVal = document.getElementById('timer-val');

    let currentStep = 0;      // 0 = ยืดซ้าย, 1 = ยืดขวา, 2 = สำเร็จ
    let holdStartTime = null; 
    const HOLD_DURATION = 5;  // ค้างไว้ 5 วินาที

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาดภาพ Canvas แบบ Mirror
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // ดึงพิกัดที่ถูกต้องตามดัชนีจริงของ MediaPipe Pose
        const rightEar = results.poseLandmarks[7];       // หูขวา (Index 7)
        const leftEar = results.poseLandmarks[8];        // หูซ้าย (Index 8)
        const rightShoulder = results.poseLandmarks[11];  // ไหล่ขวา (Index 11)
        const leftShoulder = results.poseLandmarks[12];   // ไหล่ซ้าย (Index 12)

        // 1. วาดเส้นโครงสร้างที่ถูกต้อง
        drawLine(leftEar, leftShoulder, '#FF3D00');       // เส้นหูซ้าย -> ไหล่ซ้าย (ส้ม)
        drawLine(rightEar, rightShoulder, '#FF9100');     // เส้นหูขวา -> ไหล่ขวา (ส้มอ่อน)
        drawLine(leftShoulder, rightShoulder, '#00E676'); // เส้นฐานไหล่ (เขียว)

        // 2. วาดจุดข้อต่อ
        drawPoint(leftEar, '#FF3D00');       // หูซ้าย = จุดสีส้ม
        drawPoint(rightEar, '#FF9100');      // หูขวา = จุดสีส้มอ่อน
        drawPoint(leftShoulder, '#00E676');  // ไหล่ซ้าย = จุดสีเขียว
        drawPoint(rightShoulder, '#29B6F6'); // ไหล่ขวา = จุดสีฟ้า

        // คำนวณระยะห่างแนวตั้ง (Y-distance) ระหว่างหูกับไหล่แต่ละฝั่ง
        // ยิ่งเอียงคอลงมาหาไหล่ ค่าจะยิ่งน้อยลง (เข้าใกล้ 0)
        const leftDistanceY = Math.abs(leftEar.y - leftShoulder.y);
        const rightDistanceY = Math.abs(rightEar.y - rightShoulder.y);

        // ระยะฐานไหล่กว้าง (ใช้เทียบสเกลตามระยะห่างกล้อง)
        const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);
        
        // คำนวณ Ratio การเอียงคอ (ปกติจะ ~0.55-0.70 เมื่อยืดจะลงมาเหลือน้อยกว่า 0.38)
        const leftStretchRatio = leftDistanceY / shoulderWidth;
        const rightStretchRatio = rightDistanceY / shoulderWidth;

        const currentTime = Date.now();

        // 🎯 LOGIC การจัดการขั้นตอนยืด (STEP 0 -> STEP 1 -> STEP 2)
        if (currentStep === 0) {
          // STEP 0: ยืดคอไปทาง "ซ้าย" ของผู้ใช้ (หูซ้ายเข้าหาไหล่ซ้าย)
          if (leftStretchRatio < 0.38) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอซ้าย...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดครบ 5 วินาที -> ไป STEP 1 (ยืดขวา)
              currentStep = 1;
              holdStartTime = null;
              timerVal.innerText = `⏱️ 5`;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = "1. เอียงคอไปทาง 'ซ้าย' ของคุณ (หูซ้ายชิดไหล่ซ้าย)";
            poseStatus.style.color = "#FFD54F";
            timerVal.innerText = `⏱️ 5`;
          }
        } 
        else if (currentStep === 1) {
          // STEP 1: ยืดคอไปทาง "ขวา" ของผู้ใช้ (หูขวาเข้าหาไหล่ขวา)
          if (rightStretchRatio < 0.38) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอขวา...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดครบ 5 วินาที -> จบเกม (STEP 2)
              currentStep = 2;
              holdStartTime = null;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = "2. เอียงคอไปทาง 'ขวา' ของคุณ (หูขวาชิดไหล่ขวา)";
            poseStatus.style.color = "#FF9100";
            timerVal.innerText = `⏱️ 5`;
          }
        } 
        else if (currentStep === 2) {
          // STEP 2: จบภารกิจ
          poseStatus.innerText = "🎉 ยอดเยี่ยม! คุณยืดคอครบทั้ง 2 ข้างเรียบร้อยแล้ว";
          poseStatus.style.color = "#00E676";
          timerVal.innerText = "✅ สำเร็จ";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Guided Neck Stretch Routine</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 22px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 380px;
    }
    .status { color: #FFD54F; font-weight: bold; }
    .timer { font-size: 36px; color: #00E676; font-weight: bold; margin-top: 5px; }
    .round-info { font-size: 18px; color: #29B6F6; margin-bottom: 5px; }
    .angle-debug { font-size: 16px; color: #888; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>โปรแกรมนำยืดคอแก้ Office Syndrome (ซ้าย ➔ ขวา)</p>

  <div class="score-board">
    <div class="round-info" id="round-val">รอบที่ 1 / 2</div>
    <div>สถานะ: <span id="pose-status" class="status">กำลังเตรียมพร้อม...</span></div>
    <div class="timer" id="timer-val">⏱️ 15</div>
    <div class="angle-debug">มุมเอียงซ้ายจริง: <span id="left-angle">0</span>° | มุมเอียงขวาจริง: <span id="right-angle">0</span>°</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const timerVal = document.getElementById('timer-val');
    const roundVal = document.getElementById('round-val');
    const leftAngleVal = document.getElementById('left-angle');
    const rightAngleVal = document.getElementById('right-angle');

    let currentStep = 0;          // 0 = เอียงซ้ายยืดขวา, 1 = เอียงขวายืดซ้าย, 2 = สำเร็จ
    let currentRound = 1;         // รอบปัจจุบัน
    const TOTAL_ROUNDS = 2;       // ทำซ้ำ 2 รอบ
    let holdStartTime = null; 
    const HOLD_DURATION = 15;     // ค้าง 15 วินาที
    const STRETCH_ANGLE_MIN = 70; // เกณฑ์องศาที่ถือว่าเอียงยืดจริง (เมื่อเอียงซ้าย มุมฝั่งซ้ายจะพุ่งสูงกว่า 70°)

    // คำนวณองศาเวกเตอร์ ณ จุดยอดไหล่ (vertex) เทียบระหว่างหูฝั่งเดียวกันกับไหล่ฝั่งตรงข้าม
    function calculateVectorAngle(vertex, ear, oppositeShoulder) {
      if (!vertex || !ear || !oppositeShoulder) return 90;
      const v1 = { x: ear.x - vertex.x, y: ear.y - vertex.y };
      const v2 = { x: oppositeShoulder.x - vertex.x, y: oppositeShoulder.y - vertex.y };
      
      const dot = v1.x * v2.x + v1.y * v2.y;
      const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
      const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
      
      if (mag1 * mag2 === 0) return 90;
      let cosAngle = dot / (mag1 * mag2);
      cosAngle = Math.max(-1, Math.min(1, cosAngle));
      return Math.round((Math.acos(cosAngle) * 180.0) / Math.PI);
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาด Canvas แบบ Mirror กระจกเงา
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // จับคู่จุด MediaPipe สลับฝั่งตรงตามความรู้สึกกระจกเงาของผู้ใช้งานอย่างตรงไปตรงมา:
        // Index 8 = หูซ้ายจริงของคุณ (แสดงฝั่งซ้ายของกระจก)
        // Index 7 = หูขวาจริงของคุณ (แสดงฝั่งขวาของกระจก)
        // Index 12 = ไหล่ซ้ายจริงของคุณ (แสดงฝั่งซ้ายของกระจก)
        // Index 11 = ไหล่ขวาจริงของคุณ (แสดงฝั่งขวาของกระจก)
        const userLeftEar = results.poseLandmarks[8];        
        const userRightEar = results.poseLandmarks[7];       
        const userLeftShoulder = results.poseLandmarks[12];  
        const userRightShoulder = results.poseLandmarks[11]; 

        // 1. วาดเส้นโครงสร้างตามจุดฝั่งซ้าย-ขวาจริง
        drawLine(userLeftEar, userLeftShoulder, '#FF3D00');       // เส้นซ้ายจริง (ส้ม)
        drawLine(userRightEar, userRightShoulder, '#FF9100');     // เส้นขวาจริง (ส้มอ่อน)
        drawLine(userLeftShoulder, userRightShoulder, '#00E676'); // ฐานไหล่ (เขียว)

        // 2. วาดจุดข้อต่อ
        drawPoint(userLeftEar, '#FF3D00');       
        drawPoint(userRightEar, '#FF9100');      
        drawPoint(userLeftShoulder, '#00E676');  
        drawPoint(userRightShoulder, '#29B6F6'); 

        // คำนวณองศาการเอียงคอแยกฝั่งตรงๆ:
        // userLeftTiltAngle = มุมการเอียงฝั่งซ้ายจริง (เอียงซ้าย -> ค่านี้จะพุ่งสูงขึ้น > 70°)
        // userRightTiltAngle = มุมการเอียงฝั่งขวาจริง (เอียงขวา -> ค่านี้จะพุ่งสูงขึ้น > 70°)
        const userLeftTiltAngle = calculateVectorAngle(userLeftShoulder, userLeftEar, userRightShoulder);
        const userRightTiltAngle = calculateVectorAngle(userRightShoulder, userRightEar, userLeftShoulder);

        leftAngleVal.innerText = userLeftTiltAngle;
        rightAngleVal.innerText = userRightTiltAngle;

        const currentTime = Date.now();

        if (currentStep === 0) {
          // STEP 0: สั่งเอียงคอไปทาง "ซ้ายมือของคุณ" ➔ เพื่อยืดกล้ามเนื้อคอ "ฝั่งขวา"
          roundVal.innerText = `รอบที่ ${currentRound} / ${TOTAL_ROUNDS}`;
          
          // ตรวจสอบองศาการเอียงซ้ายจริง (เมื่อเอียงซ้าย ค่าฝั่งซ้ายจะพุ่งสูงกว่า 70°)
          if (userLeftTiltAngle > STRETCH_ANGLE_MIN) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ กำลังยืดกล้ามเนื้อคอฝั่งขวา...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              currentStep = 1;
              holdStartTime = null;
              timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = `1. เอียงคอไปทาง 'ซ้ายมือของคุณ' (เพื่อยืดกล้ามเนื้อคอฝั่งขวา ค้างไว้ ${HOLD_DURATION} วินาที)`;
            poseStatus.style.color = "#FFD54F";
            timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
          }
        } 
        else if (currentStep === 1) {
          // STEP 1: สั่งเอียงคอไปทาง "ขวามือของคุณ" ➔ เพื่อยืดกล้ามเนื้อคอ "ฝั่งซ้าย"
          roundVal.innerText = `รอบที่ ${currentRound} / ${TOTAL_ROUNDS}`;
          
          // ตรวจสอบองศาการเอียงขวาจริง (เมื่อเอียงขวา ค่าฝั่งขวาจะพุ่งสูงกว่า 70°)
          if (userRightTiltAngle > STRETCH_ANGLE_MIN) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ กำลังยืดกล้ามเนื้อคอฝั่งซ้าย...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              holdStartTime = null;
              if (currentRound < TOTAL_ROUNDS) {
                currentRound++;
                currentStep = 0; // สลับกลับไปรอบ 2
                timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
              } else {
                currentStep = 2; // จบครบ 2 รอบ
              }
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = `2. เอียงคอไปทาง 'ขวามือของคุณ' (เพื่อยืดกล้ามเนื้อคอฝั่งซ้าย ค้างไว้ ${HOLD_DURATION} วินาที)`;
            poseStatus.style.color = "#FF9100";
            timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
          }
        } 
        else if (currentStep === 2) {
          roundVal.innerText = "ภารกิจเสร็จสิ้น";
          poseStatus.innerText = "🎉 ยอดเยี่ยม! คุณยืดคอครบทั้ง 2 ข้าง (ซ้ำ 2 รอบ) เรียบร้อยแล้ว";
          poseStatus.style.color = "#00E676";
          timerVal.innerText = "✅ สำเร็จ";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

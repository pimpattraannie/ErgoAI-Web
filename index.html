<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Guided Neck Stretch Routine</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 22px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 320px;
    }
    .status { color: #FFD54F; font-weight: bold; }
    .timer { font-size: 36px; color: #00E676; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>โปรแกรมนำยืดคอแก้ Office Syndrome (ซ้าย ➔ ขวา)</p>

  <div class="score-board">
    <div>สถานะ: <span id="pose-status" class="status">กำลังเตรียมพร้อม...</span></div>
    <div class="timer" id="timer-val">⏱️ 5</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const timerVal = document.getElementById('timer-val');

    // ระบบจัดการขั้นตอนเกม (0 = ยืดคอซ้าย, 1 = ยืดคอขวา, 2 = สำเร็จ)
    let currentStep = 0; 
    let holdTime = 5;    // เวลาค้างไว้ (วินาที)
    let holdTimer = null;
    let isCounting = false;

    // ฟังก์ชันคำนวณองศาจุด B-A-C (มุมที่จุด A)
    function calculateAngle(a, b, c) {
      if (!a || !b || !c) return 180;
      const radians = Math.atan2(c.y - a.y, c.x - a.x) - Math.atan2(b.y - a.y, b.x - a.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function startTimer() {
      if (isCounting) return;
      isCounting = true;
      holdTimer = setInterval(() => {
        holdTime--;
        timerVal.innerText = `⏱️ ${holdTime}`;
        if (holdTime <= 0) {
          clearInterval(holdTimer);
          isCounting = false;
          currentStep++; // เปลี่ยนไปขั้นตอนถัดไป
          holdTime = 5;
          timerVal.innerText = `⏱️ ${holdTime}`;
        }
      }, 1000);
    }

    function resetTimer() {
      if (isCounting) {
        clearInterval(holdTimer);
        isCounting = false;
        holdTime = 5;
        timerVal.innerText = `⏱️ ${holdTime}`;
      }
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาดภาพ Canvas แบบ Mirror
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // ดึงพิกัด
        const rawLeftEar = results.poseLandmarks[7];        
        const rawRightEar = results.poseLandmarks[8];       
        const rawLeftShoulder = results.poseLandmarks[11];  
        const rawRightShoulder = results.poseLandmarks[12]; 

        // สลับฝั่งพิกัด X เพื่อให้ตรงกับร่างกายของผู้ใช้บนหน้าจอ Mirror 100%
        const userLeftEar = { x: 1 - rawRightEar.x, y: rawRightEar.y };
        const userRightEar = { x: 1 - rawLeftEar.x, y: rawLeftEar.y };
        const userLeftShoulder = { x: 1 - rawRightShoulder.x, y: rawRightShoulder.y };
        const userRightShoulder = { x: 1 - rawLeftShoulder.x, y: rawLeftShoulder.y };

        // วาดเส้นโครงสร้างตามร่างกายผู้ใช้จริง
        drawLine(userLeftEar, userLeftShoulder, '#FF3D00');
        drawLine(userRightEar, userRightShoulder, '#FF9100');
        drawLine(userLeftShoulder, userRightShoulder, '#00E676');

        // วาดจุด
        drawPoint(userLeftEar, '#FF3D00');       // หูซ้ายผู้ใช้
        drawPoint(userRightEar, '#FF9100');      // หูขวาผู้ใช้
        drawPoint(userLeftShoulder, '#00E676');  // ไหล่ซ้ายผู้ใช้
        drawPoint(userRightShoulder, '#29B6F6'); // ไหล่ขวาผู้ใช้

        // คำนวณองศาการเอียงคอฝั่งซ้ายและขวาของผู้ใช้
        const userLeftAngle = calculateAngle(userLeftShoulder, userLeftEar, userRightShoulder);
        const userRightAngle = calculateAngle(userRightShoulder, userRightEar, userLeftShoulder);

        // 🎯 LOGIC การยืดตามขั้นตอน (STEP 0 -> STEP 1 -> STEP 2)
        if (currentStep === 0) {
          // ขั้นตอนที่ 1: สั่งให้ยืดคอไปทาง "ซ้าย" ของผู้ใช้
          if (userLeftAngle < 36) {
            poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอซ้าย...";
            poseStatus.style.color = "#00E676";
            startTimer();
          } else {
            poseStatus.innerText = "1. เอียงคอไปทาง 'ซ้าย' ของคุณ (หูซ้ายชิดไหล่ซ้าย)";
            poseStatus.style.color = "#FFD54F";
            resetTimer();
          }
        } 
        else if (currentStep === 1) {
          // ขั้นตอนที่ 2: สั่งให้ยืดคอไปทาง "ขวา" ของผู้ใช้
          if (userRightAngle < 36) {
            poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอขวา...";
            poseStatus.style.color = "#00E676";
            startTimer();
          } else {
            poseStatus.innerText = "2. เอียงคอไปทาง 'ขวา' ของคุณ (หูขวาชิดไหล่ขวา)";
            poseStatus.style.color = "#FF9100";
            resetTimer();
          }
        } 
        else if (currentStep === 2) {
          // ขั้นตอนที่ 3: ยืดครบทั้ง 2 ฝั่งแล้ว
          poseStatus.innerText = "🎉 ยอดเยี่ยม! คุณยืดคอครบทั้ง 2 ข้างเรียบร้อยแล้ว";
          poseStatus.style.color = "#00E676";
          timerVal.innerText = "✅ สำเร็จ";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Guided Neck Stretch Routine</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 22px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 360px;
    }
    .status { color: #FFD54F; font-weight: bold; }
    .timer { font-size: 36px; color: #00E676; font-weight: bold; margin-top: 5px; }
    .angle-debug { font-size: 16px; color: #888; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>โปรแกรมนำยืดคอแก้ Office Syndrome (ซ้าย ➔ ขวา)</p>

  <div class="score-board">
    <div>สถานะ: <span id="pose-status" class="status">กำลังเตรียมพร้อม...</span></div>
    <div class="timer" id="timer-val">⏱️ 5</div>
    <div class="angle-debug">มุมคอซ้ายของคุณ: <span id="left-angle">0</span>° | มุมคอขวาของคุณ: <span id="right-angle">0</span>°</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const timerVal = document.getElementById('timer-val');
    const leftAngleVal = document.getElementById('left-angle');
    const rightAngleVal = document.getElementById('right-angle');

    let currentStep = 0;          // 0 = ยืดซ้าย, 1 = ยืดขวา, 2 = สำเร็จ
    let holdStartTime = null; 
    const HOLD_DURATION = 5;      // ค้างไว้ 5 วินาที
    const STRETCH_THRESHOLD = 60; // องศายืดคอจริง (< 60°)

    // คำนวณองศาระหว่างจุด B-A-C (จุด A คือจุดยอดมุม)
    function calculateVectorAngle(vertex, p1, p2) {
      if (!vertex || !p1 || !p2) return 90;
      const v1 = { x: p1.x - vertex.x, y: p1.y - vertex.y };
      const v2 = { x: p2.x - vertex.x, y: p2.y - vertex.y };
      
      const dot = v1.x * v2.x + v1.y * v2.y;
      const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
      const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
      
      if (mag1 * mag2 === 0) return 90;
      let cosAngle = dot / (mag1 * mag2);
      cosAngle = Math.max(-1, Math.min(1, cosAngle));
      return Math.round((Math.acos(cosAngle) * 180.0) / Math.PI);
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // พลิก Canvas แบบ Mirror กระจกเงา
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // 🎯 สลับการจับคู่ Landmark เพื่อให้ตรงกับร่างกายจริงของผู้ใช้บนหน้าจอ Mirror 100%:
        // ไหล่ซ้ายจริงของผู้ใช้บนกระจก = MediaPipe Index 12 (Right Shoulder ในมุมมองกล้อง)
        // ไหล่ขวาจริงของผู้ใช้บนกระจก = MediaPipe Index 11 (Left Shoulder ในมุมมองกล้อง)
        const userLeftEar = results.poseLandmarks[8];        // หูซ้ายจริงของผู้ใช้
        const userRightEar = results.poseLandmarks[7];       // หูขวาจริงของผู้ใช้
        const userLeftShoulder = results.poseLandmarks[12];  // ไหล่ซ้ายจริงของผู้ใช้
        const userRightShoulder = results.poseLandmarks[11]; // ไหล่ขวาจริงของผู้ใช้

        // 1. วาดเส้นโครงสร้างตรงตามร่างกายผู้ใช้จริง
        drawLine(userLeftEar, userLeftShoulder, '#FF3D00');       // หูซ้าย -> ไหล่ซ้าย (สีส้ม)
        drawLine(userRightEar, userRightShoulder, '#FF9100');     // หูขวา -> ไหล่ขวา (สีส้มอ่อน)
        drawLine(userLeftShoulder, userRightShoulder, '#00E676'); // ฐานไหล่ซ้าย -> ไหล่ขวา (สีเขียว)

        // 2. วาดจุดข้อต่อ
        drawPoint(userLeftEar, '#FF3D00');       // จุดหูซ้าย
        drawPoint(userRightEar, '#FF9100');      // จุดหูขวา
        drawPoint(userLeftShoulder, '#00E676');  // จุดไหล่ซ้าย
        drawPoint(userRightShoulder, '#29B6F6'); // จุดไหล่ขวา

        // คำนวณองศายืดคอตามฝั่งจริงของผู้ใช้
        const userLeftAngle = calculateVectorAngle(userLeftShoulder, userLeftEar, userRightShoulder);
        const userRightAngle = calculateVectorAngle(userRightShoulder, userRightEar, userLeftShoulder);

        leftAngleVal.innerText = userLeftAngle;
        rightAngleVal.innerText = userRightAngle;

        const currentTime = Date.now();

        // 🎯 LOGIC การยืดตามร่างกายจริงของผู้ใช้
        if (currentStep === 0) {
          // STEP 0: สั่งยืดคอไปทาง "ซ้ายจริงของคุณ" (เอาหูซ้ายลงหาไหล่ซ้ายของคุณ)
          if (userLeftAngle < STRETCH_THRESHOLD) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอซ้าย...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดซ้ายครบ 5 วินาที -> ไป STEP 1 (ยืดขวา)
              currentStep = 1;
              holdStartTime = null;
              timerVal.innerText = `⏱️ 5`;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = "1. เอียงคอไปทาง 'ซ้าย' ของคุณ (เอาหูซ้ายลงหาไหล่ซ้าย)";
            poseStatus.style.color = "#FFD54F";
            timerVal.innerText = `⏱️ 5`;
          }
        } 
        else if (currentStep === 1) {
          // STEP 1: สั่งยืดคอไปทาง "ขวาจริงของคุณ" (เอาหูขวาลงหาไหล่ขวาของคุณ)
          if (userRightAngle < STRETCH_THRESHOLD) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอขวา...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดขวาครบ 5 วินาที -> จบเกม (STEP 2)
              currentStep = 2;
              holdStartTime = null;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = "2. เอียงคอไปทาง 'ขวา' ของคุณ (เอาหูขวาลงหาไหล่ขวา)";
            poseStatus.style.color = "#FF9100";
            timerVal.innerText = `⏱️ 5`;
          }
        } 
        else if (currentStep === 2) {
          // STEP 2: จบภารกิจ
          poseStatus.innerText = "🎉 ยอดเยี่ยม! คุณยืดคอครบทั้ง 2 ข้างเรียบร้อยแล้ว";
          poseStatus.style.color = "#00E676";
          timerVal.innerText = "✅ สำเร็จ";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

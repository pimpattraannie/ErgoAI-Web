<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Guided Neck Stretch Routine</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 22px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 380px;
    }
    .status { color: #FFD54F; font-weight: bold; }
    .timer { font-size: 36px; color: #00E676; font-weight: bold; margin-top: 5px; }
    .round-info { font-size: 18px; color: #29B6F6; margin-bottom: 5px; }
    .angle-debug { font-size: 16px; color: #888; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>โปรแกรมนำยืดคอแก้ Office Syndrome (ซ้าย ➔ ขวา)</p>

  <div class="score-board">
    <div class="round-info" id="round-val">รอบที่ 1 / 2</div>
    <div>สถานะ: <span id="pose-status" class="status">กำลังเตรียมพร้อม...</span></div>
    <div class="timer" id="timer-val">⏱️ 15</div>
    <div class="angle-debug">มุมคอฝั่งซ้าย: <span id="left-angle">0</span>° | มุมคอฝั่งขวา: <span id="right-angle">0</span>°</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const timerVal = document.getElementById('timer-val');
    const roundVal = document.getElementById('round-val');
    const leftAngleVal = document.getElementById('left-angle');
    const rightAngleVal = document.getElementById('right-angle');

    let currentStep = 0;          // 0 = ยืดซ้าย, 1 = ยืดขวา, 2 = สำเร็จ
    let currentRound = 1;         // รอบปัจจุบัน
    const TOTAL_ROUNDS = 2;       // ทำซ้ำ 2 รอบ
    let holdStartTime = null; 
    const HOLD_DURATION = 15;     // ค้าง 15 วินาที
    const STRETCH_THRESHOLD = 62; // องศายืดคอ (มุมฝั่งที่ยืดต้องแคบลงต่ำกว่า 62°)

    // คำนวณองศาเวกเตอร์ระหว่างจุด B-A-C (จุด A คือจุดยอดมุมที่ไหล่)
    function calculateVectorAngle(vertex, ear, oppositeShoulder) {
      if (!vertex || !ear || !oppositeShoulder) return 90;
      const v1 = { x: ear.x - vertex.x, y: ear.y - vertex.y };
      const v2 = { x: oppositeShoulder.x - vertex.x, y: oppositeShoulder.y - vertex.y };
      
      const dot = v1.x * v2.x + v1.y * v2.y;
      const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
      const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
      
      if (mag1 * mag2 === 0) return 90;
      let cosAngle = dot / (mag1 * mag2);
      cosAngle = Math.max(-1, Math.min(1, cosAngle));
      return Math.round((Math.acos(cosAngle) * 180.0) / Math.PI);
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาด Canvas แบบ Mirror กระจกเงา
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // ดึงจุดตาม Index มาตรฐานของ MediaPipe Pose
        // Index 7 = หูซ้ายจริง, Index 8 = หูขวาจริง
        // Index 11 = ไหล่ซ้ายจริง, Index 12 = ไหล่ขวาจริง
        const leftEar = results.poseLandmarks[7];        
        const rightEar = results.poseLandmarks[8];       
        const leftShoulder = results.poseLandmarks[11];  
        const rightShoulder = results.poseLandmarks[12]; 

        // 1. วาดเส้นโครงสร้างให้ตรงตามจุดจริง
        drawLine(leftEar, leftShoulder, '#FF3D00');       // เส้นฝั่งซ้ายจริง (ส้ม)
        drawLine(rightEar, rightShoulder, '#FF9100');     // เส้นฝั่งขวาจริง (ส้มอ่อน)
        drawLine(leftShoulder, rightShoulder, '#00E676'); // ฐานไหล่ (เขียว)

        // 2. วาดจุดข้อต่อ
        drawPoint(leftEar, '#FF3D00');       
        drawPoint(rightEar, '#FF9100');      
        drawPoint(leftShoulder, '#00E676');  
        drawPoint(rightShoulder, '#29B6F6'); 

        // คำนวณองศาฐานไหล่เทียบกับคอแต่ละฝั่ง:
        // leftNeckAngle = มุมคอฝั่งซ้าย (เอียงคอซ้าย -> มุมนี้จะแคบลง)
        // rightNeckAngle = มุมคอฝั่งขวา (เอียงคอขวา -> มุมนี้จะแคบลง)
        const leftNeckAngle = calculateVectorAngle(leftShoulder, leftEar, rightShoulder);
        const rightNeckAngle = calculateVectorAngle(rightShoulder, rightEar, leftShoulder);

        leftAngleVal.innerText = leftNeckAngle;
        rightAngleVal.innerText = rightNeckAngle;

        const currentTime = Date.now();

        if (currentStep === 0) {
          // STEP 0: ยืดคอไปทาง "ซ้ายมือของคุณ" 
          // เมื่อเอียงคอไปทางซ้ายจริง -> มุมคอฝั่งซ้าย (leftNeckAngle) จะลดลงต่ำกว่า 62°
          roundVal.innerText = `รอบที่ ${currentRound} / ${TOTAL_ROUNDS}`;
          if (leftNeckAngle < STRETCH_THRESHOLD) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอซ้าย...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดซ้ายครบ 15 วินาที -> เปลี่ยนไปยืดขวา
              currentStep = 1;
              holdStartTime = null;
              timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = `1. เอียงคอไปทาง 'ซ้ายมือของคุณ' (ค้างไว้ ${HOLD_DURATION} วินาที)`;
            poseStatus.style.color = "#FFD54F";
            timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
          }
        } 
        else if (currentStep === 1) {
          // STEP 1: ยืดคอไปทาง "ขวามือของคุณ" 
          // เมื่อเอียงคอไปทางขวาจริง -> มุมคอฝั่งขวา (rightNeckAngle) จะลดลงต่ำกว่า 62°
          roundVal.innerText = `รอบที่ ${currentRound} / ${TOTAL_ROUNDS}`;
          if (rightNeckAngle < STRETCH_THRESHOLD) {
            if (!holdStartTime) holdStartTime = currentTime;
            const elapsedSeconds = Math.floor((currentTime - holdStartTime) / 1000);
            const remaining = HOLD_DURATION - elapsedSeconds;

            if (remaining > 0) {
              poseStatus.innerText = "ดีมาก! ค้างไว้ ยืดคอขวา...";
              poseStatus.style.color = "#00E676";
              timerVal.innerText = `⏱️ ${remaining}`;
            } else {
              // ยืดขวาครบ 15 วินาที -> เช็กจำนวนรอบ
              holdStartTime = null;
              if (currentRound < TOTAL_ROUNDS) {
                currentRound++;
                currentStep = 0; // กลับไปยืดซ้ายรอบที่ 2
                timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
              } else {
                currentStep = 2; // จบภารกิจ
              }
            }
          } else {
            holdStartTime = null;
            poseStatus.innerText = `2. เอียงคอไปทาง 'ขวามือของคุณ' (ค้างไว้ ${HOLD_DURATION} วินาที)`;
            poseStatus.style.color = "#FF9100";
            timerVal.innerText = `⏱️ ${HOLD_DURATION}`;
          }
        } 
        else if (currentStep === 2) {
          // STEP 2: จบภารกิจ
          roundVal.innerText = "ภารกิจเสร็จสิ้น";
          poseStatus.innerText = "🎉 ยอดเยี่ยม! คุณยืดคอครบทั้ง 2 ข้าง (ซ้ำ 2 รอบ) เรียบร้อยแล้ว";
          poseStatus.style.color = "#00E676";
          timerVal.innerText = "✅ สำเร็จ";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

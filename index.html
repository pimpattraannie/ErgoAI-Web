<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoAI - Active Intervention Mini-Game</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00E676; margin-bottom: 5px; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    video { display: none; }
    canvas {
      border: 3px solid #00E676;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .score-board {
      margin-top: 15px;
      font-size: 20px;
      background: #1E1E1E;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      min-width: 320px;
    }
    .status { color: #FFD54F; font-weight: bold; }
  </style>
</head>
<body>

  <h1>ErgoAI Active Intervention</h1>
  <p>เกมยืดกล้ามเนื้อแก้ Office Syndrome (Neck Stretch Test)</p>

  <div class="score-board">
    <div>สถานะ: <span id="pose-status" class="status">กำลังตรวจจับ...</span></div>
    <div>มุมไหล่-หูซ้าย: <span id="left-angle">0</span>° | มุมไหล่-หูขวา: <span id="right-angle">0</span>°</div>
  </div>

  <br>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const poseStatus = document.getElementById('pose-status');
    const leftAngleVal = document.getElementById('left-angle');
    const rightAngleVal = document.getElementById('right-angle');

    // คำนวณองศา B-A-C (มุมที่จุด A)
    function calculateAngle(a, b, c) {
      if (!a || !b || !c) return 180;
      const radians = Math.atan2(c.y - a.y, c.x - a.x) - Math.atan2(b.y - a.y, b.x - a.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // วาดภาพ Canvas แบบ Mirror
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const leftEar = results.poseLandmarks[7];        // หูซ้าย
        const rightEar = results.poseLandmarks[8];       // หูขวา
        const leftShoulder = results.poseLandmarks[11];  // ไหล่ซ้าย
        const rightShoulder = results.poseLandmarks[12]; // ไหล่ขวา

        // 1. วาดโครงเส้น
        drawLine(leftEar, leftShoulder, '#FF3D00');
        drawLine(rightEar, rightShoulder, '#FF9100');
        drawLine(leftShoulder, rightShoulder, '#00E676');

        // 2. วาดจุด
        drawPoint(leftEar, '#FF3D00');
        drawPoint(rightEar, '#FF9100');
        drawPoint(leftShoulder, '#00E676');
        drawPoint(rightShoulder, '#29B6F6');

        // คำนวณมุมที่ฐานไหล่ซ้าย (หูซ้าย - ไหล่ซ้าย - ไหล่ขวา)
        const leftNeckAngle = calculateAngle(leftShoulder, leftEar, rightShoulder);
        // คำนวณมุมที่ฐานไหล่ขวา (หูขวา - ไหล่ขวา - ไหล่ซ้าย)
        const rightNeckAngle = calculateAngle(rightShoulder, rightEar, leftShoulder);

        leftAngleVal.innerText = leftNeckAngle;
        rightAngleVal.innerText = rightNeckAngle;

        // 🎯 LOGIC ใหม่: ตรวจจับการยืดคอที่แท้จริง
        // เมื่อเอียงคอไปทางซ้าย มุมที่ไหล่ซ้าย (leftNeckAngle) จะแคบลงมากๆ (ต่ำกว่า 35°)
        // เมื่อเอียงคอไปทางขวา มุมที่ไหล่ขวา (rightNeckAngle) จะแคบลงมากๆ (ต่ำกว่า 35°)
        if (leftNeckAngle < 35) {
          poseStatus.innerText = "ดีมาก! กำลังยืดกล้ามเนื้อคอฝั่งซ้าย ค้างไว้...";
          poseStatus.style.color = "#00E676";
        } else if (rightNeckAngle < 35) {
          poseStatus.innerText = "ดีมาก! กำลังยืดกล้ามเนื้อคอฝั่งขวา ค้างไว้...";
          poseStatus.style.color = "#00E676";
        } else {
          poseStatus.innerText = "เอียงศีรษะลงหาไหล่ (ซ้ายหรือขวา) เพื่อยืดคอ";
          poseStatus.style.color = "#FFD54F";
        }
      }
      canvasCtx.restore();
    }

    function drawLine(fromLandmark, toLandmark, color = '#FFFFFF') {
      if (!fromLandmark || !toLandmark) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(fromLandmark.x * canvasElement.width, fromLandmark.y * canvasElement.height);
      canvasCtx.lineTo(toLandmark.x * canvasElement.width, toLandmark.y * canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = color;
      canvasCtx.stroke();
    }

    function drawPoint(landmark, color = '#00E676') {
      if (!landmark) return;
      canvasCtx.beginPath();
      const x = landmark.x * canvasElement.width;
      const y = landmark.y * canvasElement.height;
      canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
